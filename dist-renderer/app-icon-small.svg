<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- The 16-32px cut, matching the Calender Maker's icon-small.svg: no
       writing rules, fatter strokes, a deeper fold and a bigger bee whose
       wings are solid rather than outlined. At this size one filled
       silhouette with two gold bands reads as a bee, while an outlined
       translucent wing on white paper antialiases to grey mush. -->
  <defs>
    <clipPath id="bodyS"><ellipse cx="0" cy="0" rx="40" ry="29"/></clipPath>
  </defs>

  <path d="M38 18 H158 L218 78 V238 H38 Z" fill="#F7F6F2"/>
  <rect x="38" y="190" width="180" height="48" fill="#F5B301"/>
  <path d="M158 18 L218 78 H158 Z" fill="#F5B301"/>
  <path d="M38 18 H158 L218 78 V238 H38 Z" fill="none" stroke="#1B1E25" stroke-width="11" stroke-linejoin="round"/>
  <path d="M158 18 L218 78 H158 Z" fill="none" stroke="#1B1E25" stroke-width="11" stroke-linejoin="round"/>
  <line x1="38" y1="190" x2="218" y2="190" stroke="#1B1E25" stroke-width="11"/>

  <g transform="translate(124 110) rotate(-12)" fill="#1B1E25">
    <ellipse cx="-8" cy="-34" rx="26" ry="15" transform="rotate(-26 -8 -34)"/>
    <ellipse cx="26" cy="-29" rx="21" ry="12" transform="rotate(-6 26 -29)"/>
    <ellipse cx="0" cy="0" rx="40" ry="29"/>
    <circle cx="-40" cy="-5" r="17"/>
    <g clip-path="url(#bodyS)" fill="#F5B301">
      <rect x="-9" y="-32" width="18" height="64"/>
      <rect x="20" y="-32" width="16" height="64"/>
    </g>
  </g>
</svg>
