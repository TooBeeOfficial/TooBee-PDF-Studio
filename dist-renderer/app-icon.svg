<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- TooBee PDF Studio.
       The sibling of the Calender Maker icon and drawn to the same rules: a
       sheet of paper rather than an app tile, square corners, a hairline dark
       edge, bee-gold accents, and the bee itself sitting where the page's
       content would be.

       What the calendar says with binder tabs and a header band, this says
       with a turned-down corner and a gold label bar along the foot — the two
       marks that make a shape read as a document file instead of a card.

       Deliberately not bee-logo.svg. That mark is the bee alone and is the
       app's sidebar logo and the sites' favicon; a bee on its own says
       "TooBee" but says nothing about what the program opens. -->
  <defs>
    <clipPath id="body"><ellipse cx="0" cy="0" rx="31" ry="22"/></clipPath>
  </defs>

  <!-- the sheet, with the corner cut away -->
  <path d="M42 16 H168 L214 62 V240 H42 Z" fill="#F7F6F2"/>

  <!-- the gold label bar along the foot, where a file type badge sits -->
  <rect x="42" y="200" width="172" height="40" fill="#F5B301"/>

  <!-- the turned corner. Filled gold and outlined, so it reads as folded
       forward rather than as a bite taken out of the page. -->
  <path d="M168 16 L214 62 H168 Z" fill="#F5B301" stroke="#1B1E25" stroke-width="5" stroke-linejoin="round"/>

  <!-- the page edge, drawn last so it sits over the bar and the fold -->
  <path d="M42.5 16.5 H167.5 L213.5 62.5 V239.5 H42.5 Z" fill="none" stroke="#1B1E25" stroke-width="5" stroke-linejoin="round"/>
  <line x1="42" y1="200" x2="214" y2="200" stroke="#1B1E25" stroke-width="5"/>

  <!-- writing rules -->
  <g stroke="#B9BCC4" stroke-width="4" stroke-linecap="round">
    <line x1="70" y1="160" x2="190" y2="160"/>
    <line x1="70" y1="180" x2="148" y2="180"/>
  </g>

  <!-- the bee -->
  <g transform="translate(128 110) rotate(-12) scale(0.95)">
    <!-- wings -->
    <g fill="#FFFFFF" fill-opacity="0.92" stroke="#1B1E25" stroke-width="4.5">
      <ellipse cx="-4"  cy="-30" rx="20" ry="12" transform="rotate(-24 -4 -30)"/>
      <ellipse cx="22"  cy="-26" rx="17" ry="10" transform="rotate(-8 22 -26)"/>
    </g>
    <!-- stinger -->
    <path d="M30 -7 L48 0 L30 7 Z" fill="#1B1E25"/>
    <!-- abdomen -->
    <ellipse cx="0" cy="0" rx="31" ry="22" fill="#1B1E25"/>
    <g clip-path="url(#body)" fill="#F5B301">
      <rect x="-6"  y="-24" width="13" height="48"/>
      <rect x="15"  y="-24" width="12" height="48"/>
    </g>
    <!-- head -->
    <circle cx="-31" cy="-3" r="13" fill="#1B1E25"/>
  </g>
</svg>
